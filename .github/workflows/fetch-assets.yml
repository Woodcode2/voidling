name: fetch-assets
# Download externally hosted assets into the repo, because the dev container's
# egress proxy blocks external hosts and a session cannot fetch them.
#
# Usage: push a .github/asset-manifest.txt whose FIRST line is the repo-relative
# destination directory. Every line after that is one asset, in either form:
#
#   https://host/path/file.mp3                     -> dest/candidate-N.mp3
#   maple  https://host/path.mp3  Pixabay Licence  -> dest/maple.mp3 + CREDITS.txt
#
# The second form is whitespace-separated: NAME, URL, then the licence as free
# text to the end of the line. Use it for anything that ships — it lands the
# file under its final name and records where it came from and under what terms,
# which is the record that answers a rights query later.
on:
  push:
    # never on main — merging a manifest change to main must not re-run the
    # fetch there (it committed duplicate candidate files directly to main)
    branches-ignore:
      - main
    paths:
      - '.github/asset-manifest.txt'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Download assets
        # A 404 used to leave the loop running and the job green, so the manifest
        # looked applied and no file existed. Every failure is fatal now.
        run: |
          set -euo pipefail
          dest=$(head -n1 .github/asset-manifest.txt)
          mkdir -p "$dest"
          i=0
          while IFS= read -r line || [ -n "$line" ]; do
            [ -z "$line" ] && continue
            case "$line" in \#*) continue ;; esac
            case "$line" in
              http*)   name=""; url="$line"; lic="" ;;
              *)       name=$(printf '%s' "$line" | awk '{print $1}')
                       url=$(printf  '%s' "$line" | awk '{print $2}')
                       lic=$(printf  '%s' "$line" | awk '{$1="";$2="";sub(/^ +/,"");print}') ;;
            esac
            [ -z "$url" ] && { echo "::error::no URL in: $line"; exit 1; }
            i=$((i+1))
            ext="${url##*.}"; ext="${ext%%\?*}"
            case "$ext" in mp3|m4a|ogg|wav|png|jpg|jpeg|webp|svg|glb) ;; *) ext=bin ;; esac
            [ -z "$name" ] && name="candidate-$i"
            echo "→ $name.$ext"
            # ── </dev/null IS LOAD-BEARING ────────────────────────────────
            # curl inherits the while-read loop's stdin and EATS A BYTE of the
            # next manifest line. Measured on the first real run: line 1
            # landed as marge-meter.webp and the next three landed as
            # leeping-koi, evin-beetle and ood-mustard — each missing exactly
            # its first character, each one consumed by the previous
            # iteration's curl. The game looks those files up by exact id, so
            # 47 of 48 stickers would have had art on disk and an empty cell
            # on screen, with nothing anywhere reporting a problem.
            curl -fsSL --retry 3 --retry-delay 2 "$url" -o "$dest/$name.$ext" </dev/null
            [ -s "$dest/$name.$ext" ] || { echo "::error::empty: $url"; exit 1; }
            # open-source Chromium cannot decode AAC, so m4a never survives
            if [ "$ext" = "m4a" ]; then
              ffmpeg -nostdin -y -loglevel error -i "$dest/$name.m4a" -codec:a libmp3lame -b:a 160k "$dest/$name.mp3"
              rm "$dest/$name.m4a"; ext=mp3
            fi
            # ── A 1024px PNG PER STICKER IS 72 MB OF REPO FOR A 56px CELL ─────
            # Generators return 1k+ PNGs; the book draws them at 56 CSS pixels
            # and the reveal at 44. Shipping the originals would put ~1.5 MB x
            # 48 into the app bundle for art nobody sees at more than 168
            # device pixels. This repo has already shipped a 200 MB payload
            # once. So: down to 512 and into webp, which is also the extension
            # the game asks for.
            case "$ext" in
              png|jpg|jpeg)
                # ── KEY THE GREEN OUT ────────────────────────────────────
                # The art is generated on flat chroma green (RGB 0,177,64) —
                # a colour no subject in the set contains — precisely so it
                # can be removed here for nothing. The result is a true
                # die-cut sticker sitting on the book's own tier colour,
                # instead of forty-eight cards each bringing its own
                # background. That drift was the one thing the four-card test
                # batch actually failed on.
                # colorkey similarity 0.30 catches the compression fringe
                # around the silhouette; blend 0.10 keeps the edge soft
                # enough not to alias at 56 CSS pixels.
                ffmpeg -nostdin -y -loglevel error -i "$dest/$name.$ext" \
                  -vf "colorkey=0x00B140:0.30:0.10,scale=512:512:force_original_aspect_ratio=decrease" \
                  -quality 90 "$dest/$name.webp"
                rm "$dest/$name.$ext"; ext=webp
                ;;
            esac
            # a file that downloaded fine and does not decode is the failure mode
            # that reaches a player as silence — or, for art, as a permanently
            # empty cell. Prove it decodes here.
            case "$ext" in
              webp|png)
                px=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$dest/$name.$ext" </dev/null)
                echo "   ${px}px"
                # WARN, do not die. A batch is dozens of independent cards;
                # one that comes back odd should not throw away the rest.
                if [ "${px:-0}" -lt 128 ]; then
                  echo "::warning::$name is ${px}px — dropping it"
                  rm -f "$dest/$name.$ext"; continue
                fi
                [ -n "$lic" ] && printf '%s\t%s\t%s\n' "$name.$ext" "$url" "$lic" >> "$dest/CREDITS.txt"
                ;;
            esac
            case "$ext" in
              mp3|ogg|wav)
                dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$dest/$name.$ext" </dev/null)
                echo "   ${dur}s"
                awk -v d="$dur" 'BEGIN{exit !(d>3)}' || { echo "::error::$name is ${dur}s"; exit 1; }
                [ -n "$lic" ] && printf '%s\t%s\t%s\n' "$name.$ext" "$url" "$lic" >> "$dest/CREDITS.txt"
                ;;
            esac
          done < <(tail -n +2 .github/asset-manifest.txt)
          echo "── $dest"
          ls -la "$dest"
      - name: Commit
        run: |
          set -euo pipefail
          dest=$(head -n1 .github/asset-manifest.txt)
          git config user.name "voidling-assets-bot"
          git config user.email "actions@github.com"
          git add "$dest"
          git commit -m "assets: fetch from manifest into $dest" || { echo "nothing to commit"; exit 0; }
          # ── THE PUSH RACES THE HUMAN ─────────────────────────────────────
          # Every manifest push starts a run, and each run ends by pushing a
          # commit of its own. Push three manifests in five minutes — which is
          # exactly what generating 48 cards in batches looks like — and run A
          # finishes into a branch that has moved twice since it checked out.
          # A bare `git push` then fails non-fast-forward, the job goes red,
          # and the art it just fetched and converted is thrown away with the
          # runner. Two runs died this way before anyone looked.
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin "$(git rev-parse --abbrev-ref HEAD)" && git push && exit 0
            echo "push race, retry $i"; sleep $((i * 5))
          done
          echo "::error::could not push after 5 attempts"; exit 1
