<h1>Maple Falls — picker concepts</h1>
<p class="lede">Same art language, six different moments. Pick one and it gets driven to finished; nothing else changes until you're happy with it.</p>

<figure><img src="/assets/hf/hf_20260915_224014_78999414-f82d-4f6f-b351-d8457713f574.png" alt="">
  <figcaption><span class="n">1</span><span class="t">Town square parade</span>
  <div class="d">Mayor on a podium, brass band marching, bunting. Closest to what you described.</div></figcaption></figure>

<figure><img src="/assets/hf/hf_20260915_224035_bf3bb1dc-1208-47f9-8227-9f37a0b74bf7.png" alt="">
  <figcaption><span class="n">2</span><span class="t">Pumpkin fair</span>
  <div class="d">Striped stalls, stacks of pumpkins, hay bales. The void is eating a pumpkin.</div></figcaption></figure>

<figure><img src="/assets/hf/hf_20260915_223954_6d24a97e-9d65-4818-968c-a68ede2227b5.png" alt="">
